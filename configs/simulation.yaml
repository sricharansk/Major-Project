simulation:
  sumo_binary_env: SUMO_BINARY
  step_length_s: 1.0
  warmup_s: 300
  evaluation_s: 3600
  seeds: [1, 2, 3, 4, 5]
  min_green_s: 7          # project-defined experimental policy, not an official NYC value
  max_green_s: 90
  yellow_s: 3
  all_red_s: 2
  ranking_weights: {delay: 0.6, queue: 0.4, side_road_penalty: 1.0, ped_penalty: 1.0}
  acceptance:
    min_delay_improvement_pct: 1.0
    max_side_road_delay_increase_pct: 10.0
    max_teleports: 0
    max_completed_trips_decrease_pct: 0.0   # a candidate may not complete fewer trips than the baseline (survivorship guard)
  workers: 4                     # parallel SUMO processes (each run is an independent process; results are ordered)
scenario:
  osm_name: west_st_corridor
  osm_bbox: "40.700,-74.020,40.737,-74.000"   # south,west,north,east; reproduces the 2026-10-20 corridor edge set
  corridor_name_regex: "^(West Street|West Side Highway|Route 9A)$"
  atr_street_regex: "WEST ST|WEST STREET|WEST SIDE HIGHWAY|ROUTE 9A"
  # Recent counts first: the most recent year in which one of these datasets has weekday PM-peak counts in BOTH
  # directions on the corridor street replaces the ATR figure (kept in the record). 2026-10-21: Vehicle
  # Classification Counts on West St at Spring St - W Houston St, 29-30 Apr 2025.
  count_sources: [classification, volume_hist]
  count_street_regex: "^(WEST ST|WEST STREET)( NB| SB)?$"
  atr_weekdays_only: true        # routine PM peak = Mon-Fri 16:00-19:00 hourly totals
  atr_by_direction: true         # use the NB and SB medians separately when both directions were counted
  fallback_main_vph: 1200        # DECLARED assumption, used only if no ATR counts match the corridor
  side_vph_assumption: 150       # DECLARED assumption per side-street approach (no matched counts)
  event_demand_scale: 1.25       # DECLARED stress-scenario surge (not observed)
  # fixed_free_flow: every flow gets one explicit route, the free-flow fastest path (sumolib, passenger class), so the
  # declared demand stays on the corridor. dynamic_insertion: plain from/to flows, which SUMO routes at insertion on
  # current travel times (its default for trips/flows); that diverted corridor traffic into the Lower Manhattan grid
  # and is kept only to reproduce the superseded 2026-10-20 runs.
  route_choice: fixed_free_flow
  min_entry_edge_m: 20           # netconvert junction joining can leave stub edges (0.2 m) at a chain start
  # OSM turn:lanes tags as hard lane restrictions (netconvert --osm.turn-lanes). false since 2026-10-21: with them, a
  # right-turn-only lane on the 45 m link south of Chambers St forces through traffic to merge within 45 m and the SB
  # queue ends at that junction; without them the lane also carries through traffic. DECLARED simplification: it can
  # overstate capacity where real lanes are turn-only.
  osm_turn_lanes: false
  # netconvert_guess: the programs netconvert generates (--tls.guess-signals), which split green about equally between
  # stages and gave the West St NB through movement ~1,000 veh/h at GS_42451370 (route-aware testbed audit
  # 2026-10-21; an earlier ~520 veh/h reading at Battery Place counted a movement the corrected route does not make
  # and was withdrawn).
  # webster_retimed: the fixed-time programs re-timed by SUMO's tools/tlsCycleAdaptation.py (Webster's method) for the
  # routine-peak demand being tested; phase order and states are unchanged, only green durations change. A DECLARED
  # assumption (not NYC DOT timing plans), fixed here before any controller comparison under this protocol.
  # calibrated_splits (protocol v5, 2026-10-21): the Webster plan for the routine peak with no side demand, with the
  # corridor green of every corridor signal scaled by one factor chosen by `simulation calibrate-splits` so that the
  # fixed-time baseline reproduces the observed PM-peak speed on the mapped DOT link (split_calibration below). A
  # DECLARED calibration: the testbed becomes a scenario calibrated to one observed speed, not a digital twin; the
  # same plan is then used at every side-demand level and by every controller.
  signal_timing: calibrated_splits
  retiming: {min_cycle_s: 20, max_cycle_s: 120, saturation_headway_s: 2.0}   # tool defaults
# Side-street demand has no matched counts, so its level is chosen by a rule fixed here BEFORE the controller
# comparison: on the routine_peak scenario, under the fixed-time baseline only, on development seeds that the
# comparison does not use, take the largest scale in the grid at which every seed has at most max_teleports teleports
# and leaves at most max_unfinished_frac of loaded vehicles unfinished. Stress scenarios then reuse the selected scale.
demand_selection:
  # earlier records: netconvert_guess (2014 ATR count, OSM turn lanes, generated programs), webster_retimed (same, re-timed)
  # earlier protocol: v4_counts2025_webster_noturnlanes (Webster re-timed per level; no admissible level)
  # v5_counts2025_calibrated_splits (2026-10-23): no calibrated program selected, so select-demand did not run
  protocol_id: v6_counts2025_cycle_splits_offsets
  side_scales: [1.0, 0.75, 0.5, 0.25, 0.0]
  seeds: [101, 102, 103]
  max_teleports: 0
  max_unfinished_frac: 0.01
# Signal-timing calibration (src/smartcity/simulation/calibrate.py). Protocol v5 was fixed here on 2026-10-21 and run on
# the workstation on 2026-10-23: corridor green of the Webster plan scaled by a factor from [1.0, 1.2, 1.4, 1.6, 1.8, 2.0,
# 2.5] at the per-signal Webster cycles (max cycle 120 s, max green 90 s, min green 7 s), seeds 101-103, no side demand,
# target 10.95 +- 1.5 mph on DOT link 4456494. Outcome: 5.82 -> 8.10 mph, factors 2.0 and 2.5 admissible, closest 2.85 mph
# short, nothing selected (simulation/scenarios/split_calibration_v5_counts2025_calibrated_splits.json). One signal sat at
# the caps from factor 1.4 on; the Webster cycles range from 21 to 102 s, so the corridor had no progression at all.
# Protocol v6, fixed here on 2026-10-25 BEFORE any run and chosen by the authors over closing the comparison or waiting
# for NYC DOT timing plans. It does not change the admissibility rule above: a cell counts only if every development
# seed passes it, and among those the cell whose seed-mean space-mean speed on the mapped link is closest to the
# observed value is taken, provided the gap is within tolerance_mph (ties: smaller green factor, then Webster cycles
# before a common cycle and the shorter common cycle, then no progression); otherwise nothing is selected and the
# comparison stays NOT RUN. Any selected program is a calibrated scenario testbed, not NYC DOT timing.
split_calibration:
  protocol_id: v6_counts2025_cycle_splits_offsets
  superseded_protocol: v5_counts2025_calibrated_splits   # its record and CSV are kept as the v5 result
  dot_link_id: "4456494"
  target_speed_mph: 10.95     # NYC DOT speeds, link 4456494, weekday 16-19 h local, 1 Apr-20 Oct 2026, 3,692 records
  target_source: reports/experiments/simulation_testbed_audit_v4_counts2025_webster_noturnlanes.json (speed_validation.observed)
  tolerance_mph: 1.5
  side_demand_scale: 0.0      # calibration at zero side demand, as the v4 speed validation and v5
  seeds: [101, 102, 103]      # development seeds; the comparison uses simulation.seeds
  max_cycle_s: 120            # bound for the Webster-cycle cells (v5 construction); a common cycle is never exceeded
  grid:                       # 5 + 2 x 5 x 2 = 25 cells x 3 seeds = 75 fixed-time runs
    # null = per-signal Webster cycles (the v5 base); a number puts every corridor signal on that cycle by scaling its
    # green phases together (clearance, phase order and states unchanged; greens floored at simulation.min_green_s)
    common_cycles_s: [null, 90, 120]
    # corridor green x factor within the cycle (other greens shortened down to min_green_s; capped at max_green_s);
    # 1.0-2.5 repeat v5 at the Webster cycles, 3.0 extends the range that v5 ended below the target
    green_factors: [1.0, 1.5, 2.0, 2.5, 3.0]
    # 0 = no offsets; 25 = each corridor signal's offset set so that its corridor green starts when a platoon that left
    # the first corridor signal's green start at 25 mph arrives (West Street is timed for 25 mph progression in
    # reality, NYC DOT Vision Zero 2014/2019); only combined with a common cycle
    progression_speeds_mph: [0, 25]
  progression_direction: mapped_link   # the chain of the mapped DOT link's direction (southbound for 4456494); the other direction is not progressed
