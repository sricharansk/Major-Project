graph:
  endpoint_join_m: 150          # downstream link start must lie within this distance of upstream link end
  max_heading_change_deg: 100   # reject U-turn-like or crossing connections
  reject_if_reverse_direction: true
  # Corridor continuity: DOT links on one signed corridor (same name stem and travel direction, e.g. "FDR N") do not
  # tile the road; consecutive segments can be separated by unmonitored stretches. A -> B is also accepted when B is
  # the nearest same-corridor link whose start lies downstream of A's end within corridor_join_m with a compatible
  # heading. Each such edge is labelled "corridor continuity" in reports/data_audit/graph_edges.csv.
  corridor_join_m: 2000
  corridor_max_heading_change_deg: 100
