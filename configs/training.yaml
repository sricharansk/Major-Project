training:
  seed: 42
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 30
  early_stopping_patience: 5
  gradient_clip_norm: 1.0
  loss: masked_huber
  huber_delta: 1.0
  max_train_windows_per_epoch: null   # null = all windows
  device: auto          # auto = CUDA when available, else CPU (resolved device recorded in each run config)
trees:
  n_estimators: 400
  learning_rate: 0.05
  max_depth: 8
  early_stopping_rounds: 30
