training:
  seed: 42
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 30
  early_stopping_patience: 5
  gradient_clip_norm: 1.0
  loss: masked_huber
  huber_delta: 1.0
  # Compute budget for the 2026-10-21 workstation run (deadline-bound): every deep model (GRU, temporal Transformer,
  # proposed, ablations) samples 4096 training windows per epoch without replacement, freshly each epoch, with the
  # same seed. null = all ~50k windows per epoch (about 3 min/epoch for the GRU on the RTX 4050; >7 h for all runs).
  max_train_windows_per_epoch: 4096
  max_minutes_per_model: null         # wall-clock budget per deep model (null = none); stop reason is recorded per run
  device: auto          # auto = CUDA when available, else CPU (resolved device recorded in each run config)
trees:
  n_estimators: 400
  learning_rate: 0.05
  max_depth: 8
  early_stopping_rounds: 30
