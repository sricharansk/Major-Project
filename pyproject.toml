[project]
name = "smartcity"
version = "0.1.0"
description = "Multi-horizon traffic congestion forecasting and explainable agentic signal advisory (MTech research prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas", "polars", "pyarrow", "geopandas", "shapely", "pyproj", "numpy", "scikit-learn",
  "torch", "torch_geometric", "torch-geometric-temporal", "networkx", "decorator",
  "xgboost", "lightgbm", "shap",
  "sentence-transformers", "faiss-cpu", "langgraph", "pydantic", "pydantic-settings",
  "httpx", "sqlalchemy", "psycopg[binary]", "geoalchemy2",
  "eclipse-sumo", "traci", "sumolib",
  "fastapi", "uvicorn", "streamlit", "plotly", "pydeck",
  "mlflow", "pyyaml", "typer",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
smartcity = "smartcity.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["realdata: requires downloaded real data", "sumo: requires SUMO", "llm: requires a reachable LLM"]

[tool.ruff]
line-length = 120
target-version = "py311"
