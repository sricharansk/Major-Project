name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_USER: smartcity, POSTGRES_PASSWORD: smartcity, POSTGRES_DB: smartcity}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U smartcity" --health-interval 10s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://smartcity:smartcity@localhost:5432/smartcity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install torch_geometric pandas polars pyarrow geopandas shapely pyproj numpy scikit-learn networkx decorator \
            xgboost lightgbm shap sentence-transformers faiss-cpu langgraph pydantic pydantic-settings httpx sqlalchemy \
            "psycopg[binary]" geoalchemy2 eclipse-sumo traci sumolib fastapi uvicorn streamlit plotly pydeck mlflow pyyaml \
            typer pypdf pytest ruff
          pip install --no-deps torch-geometric-temporal
          pip install --no-deps -e .
      - name: Lint
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Tests
        run: pytest -q tests
